<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS TRANSFORMS</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
      .box {
        /* transform: rotate(0.75turn); */

        /* agar axis ke along rotate karna hai to bas rotate ke aage x,y,z laga do aur () bracket ke andar degree ya turn ki value daal do  */
        transform:rotate(55deg);
        /* transform: rotatey(50deg); */
        /* transform: rotatez(50deg); */
        
        /* agli property scale ki h bada ya chota karna  is proeperty me bhi humlog x,y,z ke along kar sakte hai*/
        /* transform: scale(0.5); */
        
        /* aglo property skew ki h aur same x,y ke along kar sakte h exception z axis ke along ni ho sakta */
        /* transform: skew(30deg); */
        
        /* transform translate ki property niche h  isko hum x,y,z ke along kar skate hai*/
        /* transform: translate(50%); */
        
        /* agar humko ek se jyada transform ki property lgana ho to just transform likh kar property dete jao aur space lagate jao */
        /* transform: skew(50deg) translate(60%) rotate(0.25turn) scale(0.5); */
        
        /* transform-origin wo property h jiske around box ya element move karta ha degree ya turn me  ye by default 50 50 hoti */
        /* transform-origin: 50% 50%; */

        display: flex;
        justify-content: center;
        align-items: center;
        width: 50px;
        height: 50px;
        border: 1px solid red;
        background-color: yellow;
      }
      .container {
        height: 80vh;
        width: 90vw;
        border: 2px solid black;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box">box 1</div>
    </div>
  </body>
</html>
