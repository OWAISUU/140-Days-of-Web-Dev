<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STYLING LISTS </title>
    <style>
           nav ul li{
            font-size: 100px;
            /* list-style: arabic-indic; */
            background-color: rgb(217, 204, 15);
            /* ab yaha pe agar hum sirf background color ko voilet karenge to isme marker{1,2,3 numbers} wo nahi hoga  to iske liye humlog list-style-position:inside ka istemaal karege */
            list-style-position: inside;
            border: 2px solid black;
            /* list-style-image: url(https://media1.tenor.com/m/DpoeMiUwUVIAAAAd/hilarious-funny.gif); */
            list-style-type: "🔥";
            /* list-style: disc inside url(https://media1.tenor.com/m/DpoeMiUwUVIAAAAd/hilarious-funny.gif); */
           } 
    </style>
</head>
<body>
    <nav>
        <ul>
            <li>home</li>
            <li>about</li>
            <li>contact</li>
        </ul>
    </nav>
</body>
</html>
