<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS POSITION</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      .box {
        font-size: 20px;
        padding: 10px;
        margin: 2px;
        width: 90vw;
        height: 30vh;
        border: 3px solid black;
      }
      .box1 {
        position: absolute;
        top: 2px;
        left: 5px;
        /* position: absolute;
          top: 0px; */
        /* yaha par position top 0px karne par kyuki box 1 ka nearest ancestor{yani ki nearest parent ko dhundega agar uske pass position hogi to uske hisab se align karega} me kisi bhi element ke pass position hai hi nhi to ye sabse upar jo ki doctype wali line h usse align karega apni position ko adjsut karne ke liye */
        background-color: yellow;
      }
      .box2 {
        background-color: bisque;
        width: 500px;
        /* height: 30px; */
      }
      .box3 {
        /* position: fixed;
          top: 40px;
          left: 100px; */
        /* position: relative; */
        height: 60px;
        /* left: 50px; */
        background-color: aqua;
      }
      .box4 {
        background-color: violet;
      }
      .parent {
        margin: 20px;
        padding: 15px;
        border: 3px solid purple;
        /* yaha par box 1 apne position apne nearest parent ke hisab se adjust karga  */
        /* position: absolute */
        /* exception = transform, filter or perspective properties can also make element appear as positioned */
        /* transform: (o);
        filter: invert(0); */
        /* perspective: (0); */
      }
    </style>
  </head>
  <body>
    <div class="parent">
      <div class="box box1">i am a box 1</div>
      <div class="box box2">i am a box 2</div>
      <div class="box box3">i am a box 3</div>
      <div class="box box4">i am a box 4</div>
    </div>
  </body>
</html>
