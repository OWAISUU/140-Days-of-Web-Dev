    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FLEXBOX</title>
    <style>
      .container {
        border: 2px solid black;
        /* hume display flex container me lagana hoga naki items me  */
        height: 50vh;
        display: flex;
        /* niche kuch display flex ki properties h wo sabse jyda use hoti h  */
        /* justify-content: center; */
        align-items: center;
        /* flex-direction:column-reverse; */
        /* flex-wrap: wrap; */
        /* align-content center jo pink boxes h unko container ke center me kar dega */
        /* align-content: start; */
        /* there is no justify items in flexbox */
        /* basically jab humare pass ek line hoti h to items wali property use karte h aur jab ek se jayada ho to content wali property  */
        flex-flow: row wrap;
        /* gap: 20px; */
        /* column-gap: 20px */
        /* row-gap: 30px; */
        /* we can write row and column gap together by writing below code */
        gap: 40px 20px;
      }
      .items {
        /* flex grow lagane se agar humko ek item ko 2 ki jagah dena h to is ka istemal  kar sakte hai */
        /* margin: 7px;  */
        height: 54px;
        width: 55px;
        background-color: rgb(255, 165, 165);
        border: 1px solid yellow;
        /* niche div ko comment out isliye kara h ki flexgrow ka purpose samajh sake */
        /* flex-grow: 1; */
      }
      /* humne order 1 diya item 3 ko to wo sabse last me chala gya  */
      .order-1{
        order: 1;
      }
      /* niche div ko comment out isliye kara h ki flexgrow ka purpose samajh sake */
      .item1{
        /* flex-grow: 2; */
        /* align self ka istemaal hum kisi ek element ko target karne ke liye karte hai  */
        align-self: flex-end;
        background-color: yellow;
flex-shrink: 2;
      }
      .item4{
    background-color: aqua  ;
        align-self: flex-start;
      }
    </style>
  </head>
