<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS ANIMATION</title>
    <style>
        .container {
            background-color: tomato;
            width: 60vw;
            height: 50vh;

        }


        .box {
            display: flex;
            justify-content: center;
            align-items: center;
            /* background-color: rgb(184, 230, 48); */
            width: 15vw;
            height: 10vh;
            /* animation properties */
            /* animation-name: owaisanimation;
            animation-duration: 1s;
            animation-iteration-count: infinite;
            animation-timing-function: cubic-bezier(0.6, 0.07, 0, 0.96);
            animation-direction: alternate-reverse;
            animation-play-state: paused; */
            /* sab ek sath lagana ho to ye use karo */
            /* animation: name duration timing-function delay iteration-count direction fill-mode; */
            animation: owaisanimation 1s ease-in-out 3s infinite alternate-reverse,
            /* agar aap ko multiple animations lagana h to aap , comma laga ke next line me multiple animations use kar sakte ho  */
                        owaisuanimation 1s ease-in-out 2s infinite ;

        }



        @keyframes owaisanimation {
            from {

                transform: translateX(782px);
                background-color: aqua;
            }

            to {
                /* transform: translateY(350px); */
                background-color: yellow;
            }
        }
        @keyframes owaisuanimation{
            0%{
                transform: rotate(100deg);
            }
            20%{
                transform: rotate(150deg);

            }
            50%{
                transform: rotate(225deg);

            }
            80%{
                transform: rotate(300deg);
                
            }
            100%{
                transform: rotate(360deg);

            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box">
            CSS ANIMATION
        </div>
    </div>
</body>

</html>
