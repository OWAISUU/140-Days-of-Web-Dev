<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXERCISE 8 BOUNCE ANIMATION</title>
    <style>
        .box {
            animation: ballbounceX 3s linear infinite ,
                ballbounceY 0.8s ease-out infinite alternate;
            height: 121px;
            width: 121px;
            background-color: red;
            border-radius: 70px;
            position: absolute;
            bottom: 0;
            left: 0;
        }

        .container {
            position: relative;
            height: 80vh;
            width: 80vw;
            background-color: blue;
        }

        @keyframes ballbounceX {
            from {
                left: 0%;
            }

            to {
                left: 90%;
            }


        }

        @keyframes ballbounceY {
            from {
                bottom: 0;
            }

            to {
                bottom: 70%;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <div class="box">
        </div>
    </div>
</body>

</html>
