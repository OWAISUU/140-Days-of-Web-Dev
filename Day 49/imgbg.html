<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>image ko background me use karna</title>
    <style>
        .container {
            height: 500px;
            width: 700px;
            border: 2px solid black;
            /* object-fit: contain;  */
            /* jo maine yaha image diya h uska size to sahi h but agar koi choti image hoti h to wo repeat hone lagti h to repeat se bachane ke liye hum  log background-repeat:no repeat use karte hai aur humlog isko x aur y ke along bhi repeat kara sakte hai */
            /* background-repeat: no-repeat; */
            background-image: url("https://images.unsplash.com/photo-1526779259212-939e64788e3c?q=80&w=2074&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D");
            background-position: center center;
        }
        </style>
</head>

<body>
    <div class="container">
        bhai maine image ko as a background set kar diya
    </div>
</body>

</html>
