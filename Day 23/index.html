<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS DISPLAY PROPERTIES</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      .box {
        background-color: rgb(247, 182, 3);
        border: 2px solid yellow;
        color: red;
       
       padding: 54px;
       
      width: 78px;
        display: flex;
        justify-content: center;
       
      }
      span {
        background-color: yellow;
        color: rgb(14, 212, 61);
        border: 2px solid pink;
        display: flex;
        justify-content: center;
        padding: 56px;
        margin: 75px;
      }
      .red {
        background-color: blue;
      }
    </style>
  </head>
  <body>
    <div class="box">i am box</div>
    <div class="box">i am also a box</div>
    <span> i am a span </span>
    <span class="red">i am also a span</span>
  </body>
</html>
