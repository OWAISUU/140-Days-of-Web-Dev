<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS selectors</title>
    <style>
      /* element selector */
      div {
        background-color: blue;
      }
      /* class selector */
       .blue{
        background-color: yellow;
        color: violet
      }
      .red {
        background-color: rgb(255, 71, 71);
        color: burlywood;
      }
      #purple {
        background-color: springgreen;
        color: crimson;
      }
      /* child selector */
      div > article {
        color: rgb(226, 2, 174)
      }
      /* descendent selector */
      div article,
      p {
        background-color: blanchedalmond;
      }
      /* universal selector */
      *{
        margin: 0;
        padding: 0;
      }
      /* psuedo selector */
      a:visited{
        color: rgb(192, 36, 36);
      }
      a:link{
        color: violet;
      }
      a:active{
        background-color: turquoise;
      }
      a:hover{
        background-color: rgb(115, 219, 40);
      }
      p:first-child{
        background-color: olivedrab;
      }
    </style>
  </head>
  <body>
    <div class="blue">hey i am a class selector and my class is blue</div>
    <div id="purple">hey i am also a class selector but i am ID</div>
    <div>
      <article>hey i am a child selector of div</article>
    </div>
    <div class="red">
      hey i am a also a class selector and my class is red
      <p>hey i am a paragraph</p>
    </div>
    <a href="https://www.google.com">go to google </a>
    <br>
    <a href="https://www.yahoo2.com">go to yahoo </a>
    <main>
      <p>
        hey i am first child
      </p>
      <p>hey i am a second child</p>
    </main>
  </body>
  </html>
