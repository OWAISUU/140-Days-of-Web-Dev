<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS GRID</title>
    <style>
      .container {
        display: grid;
        grid-template-columns: 120px 80px;
        /* row aur column ko name hum square bracket me dete h humne prhli row ko pehla naam diya aur doosri ko doosra aur teesra 3rd row ko  */
        grid-template-rows: [pehla]100px [doosra]100px [teesri]100px;
        border: 2px solid black;
      }
      .item {
        border: 2px solid darkgreen;
        /* width: 30px; */
        height: 30px;
      }
      .item4 {

        /* 1/2 tak ka matlab h ki agar grid row ke hisab se dekhe to line 1 se 2 tak ye space lega aur agar column ke hisab se dekhe to ye same line 1 se 2 tak space occupy karega */
        grid-column: 1/3;
        grid-row: pehla/teesri;
    } 
    /* agar ek item ko doosre item par overlap karana h to same property dedo dono ko  */
    .item1{
        grid-row: 1/2;
        /* or you can do same as above by  */
        /* grid-row-start: 1; */
        /* grid-row-end:2; */
        grid-column: 1/3;
/* 1 aur 4 overlap kar gye h */
      }
    </style>
  </head>
  <body>
    <main class="container">
      <div class="item item1">1</div>
      <div class="item">2</div>
      <div class="item">3</div>
      <div class="item item4">4</div>
      <div class="item">5</div>
    </main>
  </body>
</html>
