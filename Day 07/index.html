<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FORMS-lets learn it</title>
    <link rel="stylesheet" href="style.css" />
    
  </head>
  <body>
    <h1>Form to apply for sigma web dev course</h1>
    <form action="post" method="post">
      <div> 
        <label for="username">Enter your username:</label>
        <input
          type="text"
          id="username"
          name="username"
          placeholder="Enter your username"
          required
        />
      </div>
      <div>
        <input type="radio" id="male" name="gender" value="male" />
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female" />
        <label for="female">Female</label>
      </div>
      <div>
        <input type="checkbox" id="terms" name="terms" value="agree" />
        <label for="terms">I agree to the terms and conditions</label>
      </div>
      <div>
        <label for="comment">Leave a comment:</label>
        <textarea id="comment" name="comment" placeholder="Enter your comment"></textarea>
      </div>
      <div>
        <select id="course" name="course">
          <option value="webdev">Web Development</option>
          <option value="datasci">Data Science</option>
          <option value="ml">Machine Learning</option>
        </select>
      </div>
      <button type="submit">Submit Application</button>
    </form>
  </body>
</html>
